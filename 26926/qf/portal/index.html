<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a3a31">
<title>Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{--night:#0a3a31;--em:#136b55;--gold:#b8892d;--gsoft:#ead9a6;--bg:#f1f5f0;--card:#fff;--ink:#15221d;--muted:#586a62;--line:#d5ddd3;--serif:'Tiro Bangla',Georgia,serif;--sans:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0c1a16;--card:#12261f;--ink:#e6efe9;--muted:#9db1a7;--line:#244036}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.langbar{position:fixed;top:12px;right:12px;z-index:9;display:flex;gap:2px;padding:3px;background:rgba(10,58,49,.92);border:1px solid rgba(234,217,166,.5);border-radius:999px}
.langbar button{border:0;background:none;color:var(--gsoft);border-radius:999px;padding:3px 12px;font:.9rem var(--sans);cursor:pointer}
.langbar button[aria-pressed="true"]{background:var(--gsoft);color:var(--night);font-weight:600}
.hero{background:linear-gradient(180deg,var(--night),#0e4a3e);color:#fff;padding:64px 20px 40px;text-align:center;border-bottom:4px solid var(--gold)}
.hero img{width:52px;height:52px;border-radius:10px;background:#fff}
.eyebrow{color:var(--gold);letter-spacing:.08em;font-weight:600;font-size:.85rem;margin:14px 0 6px}
.hero h1{margin:0 auto;max-width:640px;font:400 clamp(1.5rem,5vw,2.1rem)/1.35 var(--serif)}
.hero p{max-width:520px;margin:12px auto 0;color:var(--gsoft);font-size:.98rem}
main{max-width:920px;margin:0 auto;padding:32px 18px 60px}
h2{font:400 1.25rem/1.3 var(--serif);color:var(--em);margin:32px 0 14px;display:flex;gap:12px;align-items:center}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
a.role,div.role{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;padding:16px 18px;position:relative;transition:transform .12s}
a.role:hover{transform:translateY(-2px);border-top-color:var(--em)}
div.role.soon{border-top-color:var(--line);opacity:.62;cursor:default}
.lvl{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--em);color:#fff;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;margin-bottom:8px}
.soon .lvl{background:var(--muted)}
.role h3{margin:0 0 4px;font:600 1.02rem var(--sans)}
.role p{margin:0;color:var(--muted);font-size:.88rem}
.badge{position:absolute;top:14px;right:14px;background:var(--gold);color:#fff;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px}
.soon .badge{background:var(--muted)}
.home{display:inline-block;margin-top:36px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:.9rem}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 32px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);background:var(--night);color:#fff;padding:10px 20px;border-radius:8px;font-size:.92rem;border:1px solid var(--gold);transition:transform .25s;max-width:88vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="langbar" role="group" aria-label="Language">
  <button id="lBn" type="button" aria-pressed="true">বাংলা</button>
  <button id="lEn" type="button" aria-pressed="false">EN</button>
</div>

<header class="hero">
  <img id="logo" alt="">
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
</header>

<main>
  <h2 id="gH"></h2>
  <div class="grid" id="hierarchy"></div>
  <h2 id="gP"></h2>
  <div class="grid" id="partners"></div>
  <a class="home" id="home" href="../"></a>
</main>
<footer id="foot"></footer>
<div id="toast" role="status"></div>

<script>
let D=null,lang='bn';
const $=id=>document.getElementById(id);
const T=v=>v==null?'':typeof v==='object'?(v[lang]??v.bn??''):v;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&lt;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(r){
  const soon=r.status!=='live';
  const inner=`${soon?'':''}<span class="lvl">${r.level??'•'}</span><span class="badge">${soon?T(D.ui.soonBadge):''}</span><h3>${esc(T(r.title))}</h3><p>${esc(T(r.area))}</p>`;
  if(soon) return `<div class="role soon" tabindex="0" role="button" data-soon="1">${inner}</div>`;
  return `<a class="role" href="${r.href}">${inner}</a>`;
}
function render(){
  document.documentElement.lang=lang;document.title=T(D.site.title);
  $('lBn').setAttribute('aria-pressed',lang==='bn');$('lEn').setAttribute('aria-pressed',lang==='en');
  $('logo').src=D.site.logo;$('logo').alt=T(D.site.logoAlt);
  $('eyebrow').textContent=T(D.ui.eyebrow);$('title').textContent=T(D.ui.title);$('subtitle').textContent=T(D.ui.subtitle);
  $('gH').textContent=T(D.ui.groupHierarchy);$('gP').textContent=T(D.ui.groupPartners);
  $('hierarchy').innerHTML=D.hierarchy.map(card).join('');
  $('partners').innerHTML=D.partners.map(card).join('');
  $('home').textContent=T(D.ui.home);$('home').href=D.site.homeUrl;
  $('foot').textContent=T(D.ui.footer);
  document.querySelectorAll('[data-soon]').forEach(el=>{
    const go=()=>{const t=$('toast');t.textContent=T(D.ui.soonNote);t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600)};
    el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};
  });
}
function setLang(l){lang=l;try{localStorage.setItem('qfPortalLang',l)}catch(e){}render()}
async function init(){
  let saved=null;try{saved=localStorage.getItem('qfPortalLang')}catch(e){}
  const r=await fetch('data.json',{cache:'no-store'});D=await r.json();
  lang=saved==='en'||saved==='bn'?saved:(D.site.defaultLang||'bn');
  render();
}
$('lBn').onclick=()=>setLang('bn');$('lEn').onclick=()=>setLang('en');
init();
</script>
</body>
</html>
